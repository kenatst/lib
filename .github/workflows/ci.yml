name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test (iOS)
    # macos-15 runners ship Xcode 16.x with iOS 18.x simulator SDKs, matching
    # EMBER's deployment target (iOS 18.0). The destination is discovered at
    # runtime by UDID so runner-image changes can't break the run, and the job
    # fails LOUDLY if no iPhone simulator exists.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Discover an available iPhone simulator UDID
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available \
            | grep -E "iPhone.*\([0-9A-F-]{36}\)" \
            | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/' \
            | head -1)
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator found on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          NAME=$(xcrun simctl list devices available | grep "$UDID" | sed -E 's/^ *([^()]*) \(.*/\1/')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME ($UDID)"
          # Prove the destination resolves BEFORE spending minutes building.
          xcrun simctl bootstatus "$UDID" -b >/dev/null || true

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild -project Ember.xcodeproj -scheme Ember \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            test 2>&1 | tail -80

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::Available simulators"
          xcrun simctl list devices available || true
          echo "::endgroup::"
          echo "::group::Recent crash/report logs"
          ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | tail -20 || true
          echo "::endgroup::"

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/Logs/Test/*.xcresult
          retention-days: 7
