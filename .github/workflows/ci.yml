name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test (iOS)
    # macos-15 runners ship Xcode 16.x with iOS 18.x simulator SDKs, matching
    # EMBER's deployment target (iOS 18.0). The destination is DISCOVERED at
    # runtime rather than pinned, so runner-image updates can't break CI.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun simctl list devices available | sed -n '1,40p'

      - name: Discover an available iPhone simulator
        id: dest
        run: |
          PAIR=$(xcrun simctl list devices available | \
            grep -E "iPhone" | head -1 | sed -E 's/^ *([A-Za-z0-9]+.*) \(([0-9A-F-]{36})\) \(Shutdown\).*/\1/')
          NAME=$(echo "$PAIR" | sed -E 's/ \([0-9A-F-]{36}\)//')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild -project Ember.xcodeproj -scheme Ember \
            -destination 'platform=iOS Simulator,name=${{ steps.dest.outputs.name }}' \
            test 2>&1 | tail -60

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/Logs/Test/*.xcresult
          retention-days: 7
